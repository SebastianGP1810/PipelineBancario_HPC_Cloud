name: CI/CD Pipeline - Entrenamiento y Despliegue

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  verificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y libgomp1

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Verificar librerías clave
        run: |
          python -c "import lightgbm; print('lightgbm OK')"
          python -c "import xgboost; print('xgboost OK')"
          python -c "import joblib; print('joblib OK')"

      - name: Build de imagen Docker
        run: docker build -t pipeline-bancario .

  entrenamiento:
    runs-on: ubuntu-latest
    needs: verificacion
    if: "contains(github.event.head_commit.message, '[entrenar]') || github.event_name == 'workflow_dispatch'"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          lfs: true

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: sudo apt-get install -y libgomp1

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Ejecutar entrenamiento y exportar modelo
        run: python train_and_export.py

      - name: Commit automático del modelo entrenado
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add modelo_actual.pkl modelo_metadata.json escalabilidad.png escalabilidad_mejor_modelo.png tiempo_por_modelo.png
          git diff --staged --quiet || git commit -m "modelo actualizado automáticamente [skip ci]"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/SebastianGP1810/PipelineBancario_HPC_Cloud.git